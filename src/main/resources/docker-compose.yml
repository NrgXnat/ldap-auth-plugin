services:
  openldap:
    container_name: openldap
    image: bitnami/openldap:latest
    ports:
      - '1389:1389'
      - '1636:1636'
    environment:
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=password
      - LDAP_ADMIN_DN=cn=admin,dc=xnat,dc=org
      - LDAP_ROOT=dc=xnat,dc=org
      - LDAP_USERS=asmith
      - LDAP_PASSWORDS=password
    networks:
      - openldap
    volumes:
      - 'openldap:/bitnami/openldap'

networks:
  openldap:
    name: openldap
    driver: bridge

volumes:
  openldap:
    name: openldap
    driver: local

