#
# Provides a sample set of properties that can be used to configure XNAT to work with an LDAP
# test server that allows anonymous binding. For a test server that permits anonymous binding,
# you can use the docker-compose.yml file right next to this properties file:
#
#  docker compose --file src/main/resources/docker-compose.yml up --detach
#
# This creates a container supporting LDAP on port 1389 and LDAPS on port 1636.
#

address=ldap://localhost:1389
search.base=ou=users,dc=xnat,dc=org
search.filter=(uid={0})
validate.username=asmith
validate.password=password

