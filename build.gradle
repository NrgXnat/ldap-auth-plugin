buildscript {
    ext {
        vXnat = "1.12.0-SNAPSHOT"   // jakarta / Tomcat 10 line
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "jacoco"
    id "java"
    id "maven-publish"
    id "com.palantir.git-version" version "3.0.0"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
}

group "org.nrg.xnatx.plugins.auth"
version "1.3.1-SNAPSHOT"
description = "XNAT LDAP Authentication Provider"

repositories {
    // Scope mavenLocal to org.nrg.* so a locally-published SNAPSHOT of core is consumed without shadowing
    // partial third-party artifacts (e.g. ehcache-*-jakarta classifiers). See migration guide.
    mavenLocal { content { includeGroupByRegex 'org\\.nrg.*' } }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

java {
    // toolchain (not sourceCompatibility) so the build works on any default JDK — matches container-service.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}

dependencies {
    implementation("org.nrg.xnat:web") {
        transitive = false
    }
    // xnat-data-models is merged into xnat-web in monorepo 1.10+ — no separate dep
    implementation("org.nrg.xdat:core") {
        transitive = false
    }
    implementation("org.nrg:prefs") {
        transitive = false
    }
    implementation("org.nrg:framework") {
        transitive = false
    }

    implementation "org.springframework:spring-web"
    implementation "org.springframework.security:spring-security-config"
    implementation "org.springframework.security:spring-security-ldap"

    implementation "org.apache.commons:commons-lang3"
    // org.hibernate.javax.persistence:hibernate-jpa-2.1-api removed: the javax JPA API is gone in the
    // jakarta line and this plugin has no persistence/@Entity usage.
    implementation "com.google.guava:guava"
    implementation "org.slf4j:slf4j-api"

    implementation "org.springframework.security:spring-security-web"
    implementation "jakarta.servlet:jakarta.servlet-api"

    compileOnly "com.google.code.findbugs:jsr305"
}

idea {
    module {
        inheritOutputDirs = false
        outputDir = compileJava.destinationDirectory.asFile.get()
        testOutputDir = compileTestJava.destinationDirectory.asFile.get()
    }
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException e) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

compileJava {
    options.fork = true   // a cross-JDK toolchain (21) must fork
}

configurations {
    implementAndInclude
    implementation.extendsFrom(implementAndInclude)
}

// jacoco uses its default tool version: the 1.11.0 BOM no longer exports importedProperties (guide §1/§2),
// which is why lombok is hardcoded above. Matches the jakarta migration (no toolVersion override).
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

// The deployable XNAT plugin jar (-xpl classifier), matching the other monorepo plugins
// (container-service/dashboards/xnat_cr/mfa). gh/develop's ldap-auth build lacked this task.
tasks.register("xnatPluginJar", Jar) {
    zip64 true
    archiveClassifier = "xpl"
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Application-Name": project.description,
                "Build-Date": buildDate,
                "Build-Number": buildNumber,
                "Implementation-Version": project.version,
                "Implementation-Sha": gitHash,
                "Implementation-Sha-Full": gitHashFull,
                "Implementation-Commit": commitDistance,
                "Implementation-LastTag": lastTag,
                "Implementation-Branch": branchName,
                "Implementation-CleanTag": isCleanTag,
                "Implementation-Dirty": isDirty
    }
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact xnatPluginJar

            versionMapping {
                usage("java-api") {
                    fromResolutionOf("runtimeClasspath")
                }
                usage("java-runtime") {
                    fromResolutionResult()
                }
            }

            pom.withXml {
                def root = asNode()
                root.appendNode("name", "XNAT LDAP Authentication Plugin")
                root.appendNode("url", "https://bitbucket.org/xnatx/ldap-auth-plugin")
                root.appendNode("inceptionYear", "2017")

                def scm = root.appendNode("scm")
                scm.appendNode("url", "https://bitbucket.org/xnatx/ldap-auth-plugin")
                scm.appendNode("connection", "scm:https://bitbucket.org/xnatx/ldap-auth-plugin")
                scm.appendNode("developerConnection", "scm:git@bitbucket.org:xnatx/ldap-auth-plugin.git")

                def license = root.appendNode("licenses").appendNode("license")
                license.appendNode("name", "Simplified BSD 2-Clause License")
                license.appendNode("url", "https://xnat.org/about/license.php")
                license.appendNode("distribution", "repo")

                root.appendNode("developers").with {
                    def rherrick = appendNode("developer")
                    rherrick.appendNode("id", "rherrick")
                    rherrick.appendNode("name", "Rick Herrick")
                    rherrick.appendNode("email", "jrherrick@wustl.edu")

                    def mfmckay = appendNode("developer")
                    mfmckay.appendNode("id", "mfmckay")
                    mfmckay.appendNode("name", "Mike McKay")
                    mfmckay.appendNode("email", "mfmckay@wustl.edu")

                    def kalpert = appendNode("developer")
                    kalpert.appendNode("id", "kalpert")
                    kalpert.appendNode("name", "Kate Alpert")
                    kalpert.appendNode("email", "kate@radiologics.com")
                }
            }
        }
    }

    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}
